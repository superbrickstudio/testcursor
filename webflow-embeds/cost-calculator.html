<!-- ============================================================
  Altus cost calculator — Webflow embed
  Paste this entire snippet into a single Webflow Embed element.
  Edit the CONFIG object at the top of the <script> to change
  prices, rates, included licences or currencies.
============================================================ -->
<style>
  .ac-calc, .ac-calc * { box-sizing: border-box; margin: 0; }
  .ac-calc {
    --ac-purple: var(--_primitives---altus--purple-bright, #9b7cff);
    --ac-dark: var(--_primitives---altus--950, #0c080c);
    --ac-border: var(--_primitives---opacity--neutral-darkest-10, rgba(0, 0, 0, 0.1));
    --ac-white: #fff;
    --ac-mono: var(--_typography---font-styles--mono, "IBM Plex Mono", monospace);
    display: grid;
    grid-template-columns: 1.25fr 1fr;
    background: var(--ac-white);
    border: 1px solid var(--ac-border);
    border-radius: 0.5rem;
    overflow: hidden;
  }
  .ac-calc__controls { padding: 2.5rem; display: flex; flex-direction: column; gap: 2rem; }
  .ac-calc__label {
    font-family: var(--ac-mono);
    text-transform: uppercase;
    font-size: 0.875rem;
    font-weight: 400;
    display: block;
    margin-bottom: 0.5rem;
  }
  .ac-calc__pills { display: inline-flex; border: 1px solid var(--ac-border); border-radius: 0.375rem; padding: 0.25rem; gap: 0.25rem; }
  .ac-calc__pill {
    flex: 1;
    border: none;
    background: transparent;
    border-radius: 0.25rem;
    padding: 0.625rem 1rem;
    cursor: pointer;
    font-family: var(--ac-mono);
    text-transform: uppercase;
    font-size: 0.75rem;
    color: inherit;
    transition: background-color 0.2s ease, color 0.2s ease;
  }
  .ac-calc__pill:hover { background: rgba(155, 124, 255, 0.12); }
  .ac-calc__pill.is-active { background: var(--ac-purple); color: var(--ac-white); }
  .ac-calc__row { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
  .ac-calc__input {
    width: 100%;
    border: 0;
    border-bottom: 1px solid var(--ac-border);
    background: transparent;
    padding: 0.5rem 0;
    font: inherit;
    color: inherit;
    outline: none;
  }
  .ac-calc__input:focus { border-bottom-color: var(--ac-dark); }
  .ac-calc__hint { font-size: 0.875rem; opacity: 0.55; margin-top: 0.5rem; }
  .ac-calc__summary { background: var(--ac-dark); color: var(--ac-white); padding: 2.5rem; display: flex; flex-direction: column; }
  .ac-calc__summary-title {
    font-family: var(--ac-mono);
    text-transform: uppercase;
    font-size: 0.75rem;
    opacity: 0.6;
    margin-bottom: 2rem;
  }
  .ac-calc__lines { display: flex; flex-direction: column; gap: 1rem; }
  .ac-calc__line { display: flex; justify-content: space-between; gap: 1.5rem; font-size: 0.9375rem; opacity: 0.8; }
  .ac-calc__total-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 1.5rem;
    border-top: 1px solid rgba(255, 255, 255, 0.2);
    margin-top: 2rem;
    padding-top: 1.5rem;
  }
  .ac-calc__total { font-size: 3rem; line-height: 1; letter-spacing: -0.1rem; }
  .ac-calc__billed { font-size: 0.875rem; opacity: 0.6; }
  @media (max-width: 991px) {
    .ac-calc { grid-template-columns: 1fr; }
  }
  @media (max-width: 479px) {
    .ac-calc__controls, .ac-calc__summary { padding: 1.5rem; }
    .ac-calc__row { grid-template-columns: 1fr; }
    .ac-calc__pills { flex-wrap: wrap; }
  }
</style>

<div class="ac-calc" id="ac-calc">
  <div class="ac-calc__controls">
    <div>
      <span class="ac-calc__label">Currency</span>
      <div class="ac-calc__pills" data-ac-currencies></div>
    </div>
    <div>
      <span class="ac-calc__label">Your tier</span>
      <div class="ac-calc__pills" data-ac-tiers></div>
    </div>
    <div class="ac-calc__row">
      <div>
        <label class="ac-calc__label" for="ac-managers">Manager licences</label>
        <input class="ac-calc__input" id="ac-managers" type="number" value="10" min="0" step="1" />
        <div class="ac-calc__hint" data-ac-managers-hint>First 10 included in your plan</div>
      </div>
      <div>
        <label class="ac-calc__label" for="ac-contributors">Contributor licences</label>
        <input class="ac-calc__input" id="ac-contributors" type="number" value="0" min="0" step="1" />
        <div class="ac-calc__hint" data-ac-contributors-hint></div>
      </div>
    </div>
  </div>
  <div class="ac-calc__summary">
    <div class="ac-calc__summary-title">Your estimate</div>
    <div class="ac-calc__lines">
      <div class="ac-calc__line"><span data-ac-plan-label></span><span data-ac-plan-price></span></div>
      <div class="ac-calc__line"><span data-ac-managers-label></span><span data-ac-managers-price></span></div>
      <div class="ac-calc__line"><span data-ac-contributors-label></span><span data-ac-contributors-price></span></div>
    </div>
    <div class="ac-calc__total-row">
      <div>
        <div>Total per month</div>
        <div class="ac-calc__billed">Billed annually</div>
      </div>
      <div class="ac-calc__total" data-ac-total></div>
    </div>
  </div>
</div>

<script>
  (function () {
    /* ================== CONFIG — edit prices here ================== */
    var CONFIG = {
      plans: [
        { name: 'Project', price: 1440 },
        { name: 'Portfolio', price: 2560 },
        { name: 'Strategy', price: 3200 },
      ],
      managerRate: 10,        /* per additional manager, per month */
      contributorRate: 5,     /* per contributor, per month */
      includedManagers: 10,   /* manager licences included in every plan */
      currencies: [
        { code: 'USD', symbol: '$' },
        { code: 'EURO', symbol: '€' },
        { code: 'GBP', symbol: '£' },
        { code: 'AUD', symbol: '$' },
      ],
    };
    /* =============================================================== */

    var root = document.getElementById('ac-calc');
    if (!root) return;

    var state = { plan: 0, currency: 0 };
    var managers = root.querySelector('#ac-managers');
    var contributors = root.querySelector('#ac-contributors');

    function q(sel) { return root.querySelector(sel); }
    function fmt(n) { return n.toLocaleString('en-US'); }
    function sym() { return CONFIG.currencies[state.currency].symbol; }

    function makePills(container, items, key, onSelect) {
      items.forEach(function (item, i) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'ac-calc__pill' + (i === 0 ? ' is-active' : '');
        b.textContent = item[key];
        b.addEventListener('click', function () {
          container.querySelectorAll('.ac-calc__pill').forEach(function (p) { p.classList.remove('is-active'); });
          b.classList.add('is-active');
          onSelect(i);
          update();
        });
        container.appendChild(b);
      });
    }

    function update() {
      var plan = CONFIG.plans[state.plan];
      var m = Math.max(0, Math.floor(Number(managers.value) || 0));
      var c = Math.max(0, Math.floor(Number(contributors.value) || 0));
      var extraM = Math.max(0, m - CONFIG.includedManagers);
      var mCost = extraM * CONFIG.managerRate;
      var cCost = c * CONFIG.contributorRate;
      var s = sym();

      q('[data-ac-plan-label]').textContent = plan.name + ' plan';
      q('[data-ac-plan-price]').textContent = s + fmt(plan.price);
      q('[data-ac-managers-label]').textContent = extraM + ' additional manager' + (extraM === 1 ? '' : 's');
      q('[data-ac-managers-price]').textContent = s + fmt(mCost);
      q('[data-ac-contributors-label]').textContent = c + ' contributor' + (c === 1 ? '' : 's');
      q('[data-ac-contributors-price]').textContent = s + fmt(cCost);
      q('[data-ac-total]').textContent = s + fmt(plan.price + mCost + cCost);
      q('[data-ac-managers-hint]').textContent =
        'First ' + CONFIG.includedManagers + ' included, then ' + s + CONFIG.managerRate + ' per user, per month';
      q('[data-ac-contributors-hint]').textContent = s + CONFIG.contributorRate + ' per user, per month';
    }

    makePills(q('[data-ac-currencies]'), CONFIG.currencies, 'code', function (i) { state.currency = i; });
    makePills(q('[data-ac-tiers]'), CONFIG.plans, 'name', function (i) { state.plan = i; });
    managers.addEventListener('input', update);
    contributors.addEventListener('input', update);
    update();
  })();
</script>
